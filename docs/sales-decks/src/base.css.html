<style>
/* 4:5 pages (1080x1350), black canvas, art-led openers, real app screens. */
:root{
  --canvas:#000; --surface:#161616; --raised:#1F1F1F;
  --text:#fff; --text2:#A3A3A3; --text3:#6B6B6B; --teal:#2DD4BF;
  --sans:'Hanken Grotesk','Helvetica Neue',Arial,sans-serif;
  --serif:'Instrument Serif',Georgia,serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@page{size:1080px 1350px;margin:0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);color:var(--text);font-family:var(--sans);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:1080px;height:1350px;position:relative;overflow:hidden;page-break-after:always;display:flex;flex-direction:column}
.page:last-child{page-break-after:auto}
.pad{padding:0 88px}
.top{position:absolute;top:72px;left:88px;right:88px;display:flex;align-items:center;justify-content:space-between;z-index:3}
.brand{display:flex;align-items:center;gap:16px}
.brand img{width:56px;height:56px;border-radius:14px}
.brand span{font-family:var(--serif);font-style:italic;font-size:40px}
.brand em{font-style:inherit;color:var(--teal)}
.pg{font-family:var(--mono);font-size:20px;color:rgba(255,255,255,.6);letter-spacing:2px}
.status{font-size:18px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#fff}
.status:before{content:"";display:inline-block;width:12px;height:12px;border-radius:12px;background:var(--teal);margin-right:12px;vertical-align:1px}

/* full-bleed art */
.bleed{position:absolute;inset:0}
.bleed img{width:100%;height:100%;object-fit:cover}
.bleed:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,.15) 45%,rgba(0,0,0,.92) 72%,#000 100%)}

/* art band at the top of a feature page */
.band{position:relative;height:500px;flex:none}
.band img{width:100%;height:100%;object-fit:cover}
.band:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.6) 0%,rgba(0,0,0,.05) 30%,rgba(0,0,0,.35) 62%,#000 100%)}
.band .head{position:absolute;left:88px;right:88px;bottom:6px;z-index:2}

.eyebrow{font-family:var(--serif);font-style:italic;font-size:44px;color:rgba(255,255,255,.78);margin:0 0 8px}
h1{font-size:104px;line-height:.96;font-weight:800;letter-spacing:-3px;margin:0;text-wrap:balance}
h2{font-size:70px;line-height:1.02;font-weight:800;letter-spacing:-1.8px;margin:0;text-wrap:balance}
.lede{font-size:32px;line-height:1.45;color:#D4D4D4;margin:26px 0 0;max-width:840px}

.split{display:grid;grid-template-columns:1fr 300px;gap:52px;align-items:start;margin-top:44px}
.shot{width:300px;border-radius:38px;overflow:hidden;background:var(--surface);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.shot img{display:block;width:100%}
.list{display:flex;flex-direction:column;gap:26px}
.item b{display:block;font-size:30px;font-weight:700;line-height:1.25}
.item span{display:block;font-size:24px;line-height:1.45;color:var(--text2);margin-top:5px}
.item b:before{content:"";display:inline-block;width:10px;height:10px;border-radius:10px;background:var(--teal);margin-right:14px;vertical-align:6px}
.item b .tag,.tag{display:inline-block;margin-top:0;font-family:var(--mono);font-size:15px;letter-spacing:1px;color:var(--text3);margin-left:10px;vertical-align:4px;text-transform:uppercase}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:40px}
.tile{background:var(--surface);border-radius:28px;padding:32px 32px 34px}
.tile small{display:block;font-size:16px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--teal)}
.tile strong{display:block;font-size:34px;font-weight:800;margin-top:10px;line-height:1.12;letter-spacing:-.5px}
.tile p{font-size:22px;line-height:1.45;color:var(--text2);margin:10px 0 0}

.roles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;margin-top:40px}
.role{background:var(--surface);border-radius:28px;padding:30px 28px 32px}
.role .k{font-family:var(--serif);font-style:italic;font-size:46px;line-height:1}
.role p{font-size:22px;line-height:1.45;color:var(--text2);margin:14px 0 0}

.pair{display:flex;gap:28px;justify-content:center;margin-top:40px}
.pair .shot{width:290px}

.foot{margin-top:auto;padding:0 88px 72px;display:flex;justify-content:space-between;align-items:flex-end;font-size:22px;color:var(--text3)}
.mono{font-family:var(--mono)}
.cta{margin-top:40px;background:#fff;color:#0A0A0A;border-radius:24px;padding:32px 40px;font-size:34px;font-weight:800;text-align:center}
.contact{margin-top:22px;background:rgba(22,22,22,.92);border-radius:24px;padding:28px 36px;font-size:27px;line-height:1.6;color:var(--text2)}
.contact b{color:var(--text)}
.bottom{position:relative;z-index:2;margin-top:auto;padding:0 88px 80px}
</style>
